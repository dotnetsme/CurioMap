# CurioMap local development stack.
#
#   docker compose up -d                      # infrastructure only: Postgres, Redis, smtp4dev
#   docker compose --profile app up -d --build  # ...plus the API and web app, fully containerised
#
# Postgres is exposed on 5433 and Redis on 6380 so they do not clash with a Postgres/Redis you
# may already run on the default ports. The credentials below are for local development only.
# See docs/development.md for the full guide.

services:
  postgres:
    image: postgres:17-alpine
    container_name: curiomap-postgres
    environment:
      POSTGRES_USER: curiomap
      POSTGRES_PASSWORD: curiomap
      POSTGRES_DB: curiomap
    ports:
      - "5433:5432"
    volumes:
      - curiomap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curiomap -d curiomap"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: curiomap-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - curiomap_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  smtp4dev:
    image: rnwood/smtp4dev:v3
    container_name: curiomap-smtp4dev
    restart: unless-stopped
    ports:
      - "5000:80"     # Web UI for inspecting captured emails
      - "2525:25"     # SMTP port for app email capture
    environment:
      - ServerOptions__HostName=smtp4dev

  # --- Optional: the application itself (profile "app") -------------------------------------
  # Handy if you do not want to install the .NET SDK or Node.js. For day-to-day development,
  # running the API and web app on your machine (npm run dev) gives faster feedback.

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    container_name: curiomap-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Development mode: public dev-only JWT secret, demo readers seeded. Never reuse for a real deploy.
      ASPNETCORE_ENVIRONMENT: Development
      DATABASE_URL: postgres://curiomap:curiomap@postgres:5432/curiomap?sslmode=disable
      REDIS_URL: redis:6379
      Cors__Origins__0: http://localhost:3000
      # Register with this email to get a moderator account (see /admin).
      Admin__Emails__0: admin@curiomap.local
    ports:
      - "8080:8080"

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/web.Dockerfile
      args:
        # Next.js bakes the /api proxy target in at build time.
        API_INTERNAL_URL: http://api:8080
    container_name: curiomap-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  curiomap_pgdata:
  curiomap_redisdata:
