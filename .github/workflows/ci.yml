name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only read the repo. The deploy job runs behind the `fly` environment.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (build + test + migrations)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build backend/CurioMap.slnx --nologo
      - name: Format (AGENTS.md §0 — formatting must not drift)
        run: dotnet format backend/ --verify-no-changes
      - name: Test
        run: dotnet test backend/CurioMap.slnx --no-build --nologo
      - name: Route coverage audit (AGENTS.md §4B — controllers are the source of truth)
        run: npm run audit:routes:strict
      - name: Verify EF Core Migration Bundle
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.10
          dotnet ef migrations bundle --project backend/src/CurioMap.Api/CurioMap.Api.csproj -o /tmp/efbundle

  web:
    name: Web (lint + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build

  images:
    # The production images must keep building: a broken Dockerfile otherwise only surfaces at deploy.
    name: Container images (build only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/api.Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/web.Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to Fly.io
    # Contributor PRs must never trigger a prod deploy: only pushes to main
    # (never PRs), and only after a human approves the `fly` environment.
    # Configure the approval in GitHub: Settings → Environments → fly →
    # "Required reviewers". The environment below enforces it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, web, images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: fly
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
      - name: Deploy API (EF Core migrations executed via Fly release_command)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.api.toml --remote-only
      - name: Deploy Web
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.web.toml --remote-only
